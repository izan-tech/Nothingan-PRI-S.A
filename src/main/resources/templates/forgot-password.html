<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperació de contrasenya</title>
    <link rel="stylesheet" th:href="@{/login.css}">
</head>
<body>
    <main class="login-container">
        <section class="brand-column">
            <span class="badge-location">Terrassa · Des de 1988</span>
            <h1>Recuperació de contrasenya</h1>
            <p>Per protegir el teu compte, posa't en contacte amb l'administrador per restablir la contrasenya.</p>
        </section>
        <section class="form-column">
            <div class="card-login">
                <h2>Has oblidat la contrasenya?</h2>
                <p class="subtitle">El restabliment automàtic encara no està disponible. Contacta amb l'administrador del sistema.</p>
                <a th:href="@{/login}" class="btn-submit" style="display: block; text-align: center; text-decoration: none;">
                    Tornar a iniciar sessió
                </a>
            </div>
        </section>
    </main>
</body>
</html>
