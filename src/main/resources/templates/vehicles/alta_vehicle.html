<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donar d'Alta Vehicle - NOTHINGAN PRI S.A</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- FontAwesome per les icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Unificat -->
    <link rel="stylesheet" th:href="@{/agents.css}">
</head>
<body>

    <!-- Sidebar Lateral -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark m-0">Alta de Nou Vehicle</h2>
                <p class="text-muted small mb-0 mt-1">Registre de nous vehicles a la flota de lloguer.</p>
            </div>
            <div>
                <a th:href="@{/dashboard/vehicles}" class="btn btn-secondary fw-semibold px-3 py-2" style="border-radius: 8px;">
                    <i class="fa-solid fa-arrow-left me-1"></i> Tornar al llistat
                </a>
            </div>
        </div>

        <div class="form-card shadow-sm">
            <form th:action="@{/dashboard/vehicles/guardar}" th:object="${vehicle}" method="post" enctype="multipart/form-data" novalidate>
                
                <!-- Resum d'errors globals si falten camps obligatoris -->
                <div class="alert alert-danger shadow-sm mb-4" th:if="${#fields.hasAnyErrors()}">
                    <div class="fw-bold mb-1">
                        <i class="fa-solid fa-triangle-exclamation me-1"></i> Revisa els camps següents abans de desar el vehicle:
                    </div>
                    <ul class="mb-0 small">
                        <li th:each="err : ${#fields.allErrors()}" th:text="${err}">Error de camp</li>
                    </ul>
                </div>

                <!-- 1. Dades Principals -->
                <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">1. Especificacions del vehicle</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Matrícula (Ex: 1234ABC) *</label>
                        <input type="text" th:field="*{matricula}" class="form-control text-uppercase" 
                               th:classappend="${#fields.hasErrors('matricula')} ? 'is-invalid'"
                               placeholder="1234ABC" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Marca *</label>
                        <input type="text" th:field="*{marca}" class="form-control" 
                               th:classappend="${#fields.hasErrors('marca')} ? 'is-invalid'"
                               placeholder="Ex: Toyota" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Model *</label>
                        <input type="text" th:field="*{model}" class="form-control" 
                               th:classappend="${#fields.hasErrors('model')} ? 'is-invalid'"
                               placeholder="Ex: Corolla" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Any de matriculació *</label>
                        <input type="number" th:field="*{anyMatriculacio}" class="form-control" 
                               th:classappend="${#fields.hasErrors('anyMatriculacio')} ? 'is-invalid'"
                               placeholder="2023" min="1900" max="2100" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('anyMatriculacio')}" th:errors="*{anyMatriculacio}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Tipus de vehicle *</label>
                        <select th:field="*{tipusVehicle}" class="form-select" 
                                th:classappend="${#fields.hasErrors('tipusVehicle')} ? 'is-invalid'" required>
                            <option value="">Selecciona un tipus...</option>
                            <option value="Turisme">Turisme</option>
                            <option value="Furgoneta">Furgoneta</option>
                            <option value="SUV">SUV</option>
                            <option value="Motocicleta">Motocicleta</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('tipusVehicle')}" th:errors="*{tipusVehicle}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Estat operatiu *</label>
                        <select th:field="*{estat}" class="form-select" 
                                th:classappend="${#fields.hasErrors('estat')} ? 'is-invalid'" required>
                            <option value="DISPONIBLE">DISPONIBLE</option>
                            <option value="EN MANTENIMENT">EN MANTENIMENT</option>
                            <option value="RESERVAT">RESERVAT</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('estat')}" th:errors="*{estat}"></div>
                    </div>
                </div>

                <!-- 2. Condicions i Tarifes -->
                <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">2. Tarifes i condicions</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label">Preu per hora (€) *</label>
                        <input type="number" step="0.01" th:field="*{preuHora}" class="form-control" 
                               th:classappend="${#fields.hasErrors('preuHora')} ? 'is-invalid'"
                               placeholder="15.00" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('preuHora')}" th:errors="*{preuHora}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Fiança (€) *</label>
                        <input type="number" step="0.01" th:field="*{fianca}" class="form-control" 
                               th:classappend="${#fields.hasErrors('fianca')} ? 'is-invalid'"
                               placeholder="300.00" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fianca')}" th:errors="*{fianca}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Límit de quilometratge (opcional)</label>
                        <input type="number" th:field="*{limitQuilometratge}" class="form-control" 
                               th:classappend="${#fields.hasErrors('limitQuilometratge')} ? 'is-invalid'"
                               placeholder="Ex: 300">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('limitQuilometratge')}" th:errors="*{limitQuilometratge}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mínim de dies de lloguer *</label>
                        <input type="number" th:field="*{minDiesLloguer}" class="form-control" 
                               th:classappend="${#fields.hasErrors('minDiesLloguer')} ? 'is-invalid'"
                               placeholder="1" min="1" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('minDiesLloguer')}" th:errors="*{minDiesLloguer}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Màxim de dies de lloguer *</label>
                        <input type="number" th:field="*{maxDiesLloguer}" class="form-control" 
                               th:classappend="${#fields.hasErrors('maxDiesLloguer')} ? 'is-invalid'"
                               placeholder="30" min="1" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('maxDiesLloguer')}" th:errors="*{maxDiesLloguer}"></div>
                    </div>
                </div>

                <!-- 3. Fotografia i Descripció -->
                <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">3. Imatge i detalls addicionals</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-12">
                        <label class="form-label">Fotografia del vehicle</label>
                        <input type="file" name="file" accept="image/png, image/jpeg, image/webp" class="form-control">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Descripció pública *</label>
                        <textarea th:field="*{descripcio}" class="form-control" 
                                  th:classappend="${#fields.hasErrors('descripcio')} ? 'is-invalid'"
                                  rows="3" placeholder="Detalls públics del vehicle..." required></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcio')}" th:errors="*{descripcio}"></div>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Comentaris privats (Ús intern)</label>
                        <textarea th:field="*{comentarisPrivats}" class="form-control" rows="2" placeholder="Anotacions sobre el manteniment o historial intern..."></textarea>
                    </div>
                </div>

                <!-- Botons -->
                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a th:href="@{/dashboard/vehicles}" class="btn btn-light border px-4 fw-semibold" style="border-radius: 8px;">Cancel·lar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold" style="border-radius: 8px;">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Desar vehicle
                    </button>
                </div>

            </form>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
