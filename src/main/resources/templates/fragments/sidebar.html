<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <body>

        <aside class="sidebar" th:fragment="sidebar">
            <div class="brand">
                NOTHINGAN PRI S.A
                <span>PANEL DE CONTROL AGENT</span>
            </div>
            <nav class="mt-3">
                <a th:href="@{/dashboard}" class="nav-link">
                    <i class="fa-solid fa-border-all"></i> Dashboard
                </a>
                <a th:href="@{/dashboard/vehicles}" class="nav-link">
                    <i class="fa-solid fa-car"></i> Flota de Vehicles
                </a>
                <!-- Només visible per ADMIN -->
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/dashboard/agents/llista}" class="nav-link">
                    <i class="fa-solid fa-user-gear"></i> Gestió d'Agents
                </a>
                <a th:href="@{/dashboard/clients}" class="nav-link">
                    <i class="fa-solid fa-users"></i> Gestió de Clients
                </a>
                <a th:href="@{/dashboard/reserves}" class="nav-link">
                    <i class="fa-regular fa-calendar-check"></i> Reserves Actives
                </a>
                <a th:href="@{/dashboard/informes/reserves}" class="nav-link">
                    <i class="fa-solid fa-chart-line"></i> Informes de Reserves
                </a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="nav-link nav-link-button">
                        <i class="fa-solid fa-right-from-bracket"></i> Tancar sessió
                    </button>
                </form>
            </nav>
        </aside>

    </body>
</html>
